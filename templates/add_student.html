{% extends "base.html" %}

{% block title %}添加学生 - 学生管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h2>➕ 添加学生</h2>
    <a href="{{ url_for('student_list') }}" class="btn btn-secondary">← 返回列表</a>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_student') }}" class="student-form">
        <div class="form-group">
            <label for="name">姓名 <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="请输入学生姓名" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="age">年龄 <span class="required">*</span></label>
                <input type="number" id="age" name="age" min="1" max="150" placeholder="请输入年龄" required>
            </div>
            <div class="form-group">
                <label for="gender">性别 <span class="required">*</span></label>
                <select id="gender" name="gender" required>
                    <option value="">-- 请选择 --</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="student_no">学号 <span class="required">*</span></label>
            <input type="text" id="student_no" name="student_no" placeholder="请输入学号（唯一）" required>
        </div>

        <div class="form-group">
            <label for="phone">电话</label>
            <input type="text" id="phone" name="phone" placeholder="请输入联系电话">
        </div>

        <div class="form-group">
            <label for="address">地址</label>
            <input type="text" id="address" name="address" placeholder="请输入家庭地址">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">✅ 确认添加</button>
            <a href="{{ url_for('student_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
